## IDF Component Manager Manifest File
dependencies:
  lvgl/lvgl:
    version: "9.5.*"
    public: true
  espressif/esp_lvgl_port:
    # Pinned below 2.9.0: that release renamed the DPI panel vsync callback
    # (on_refresh_done -> on_frame_buf_complete) assuming IDF >=5.5.0 has the
    # new field, but this project's IDF v5.5.3 doesn't - only later IDF point
    # releases do. 2.8.0 still targets the field IDF 5.5.3 actually has,
    # and already carries full LVGL9 + ESP32-P4 DSI support.
    version: "2.8.0"
    public: true